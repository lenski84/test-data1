<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montageplanung SMB</title>
<style>
/* ==========================================================================
   Montageplanung SMB – Klick-Prototyp
   1920×1080-Bühne, per transform: scale auf jede 16:9-Auflösung skaliert
   (3840×2160 → Faktor 2). Alle Daten fiktiv, Änderungen nur im Browser.
   Farbwelt: Schaeffler-Grün + Weiß + Grautöne; Status-/Ampelfarben nur als Signal.
   ========================================================================== */
:root{
  --green:#00893D; --green-dk:#006B2F; --green-lt:#E6F3EC; --green-ln:#C9E2D3;
  --surface:#F4F5F6; --surface-2:#ECEEF0; --line:#D9DCDF; --line-2:#C5CACF;
  --text-2:#5F6870; --text-3:#7A838B; --text:#1F2328; --white:#FFFFFF;
  --st-an:#2E9E4F; --st-sc:#F2A900; --st-ex:#1F6FD1; --st-dr:#8A3FD1; --st-ab:#D7263D;
  --amp-g:#2E9E4F; --amp-y:#F2C94C; --amp-r:#D7263D;
  --warn:#E8710A;
  --ph1:#7FBF97; --ph2:#58A877; --ph3:#2E8655; --ph4:#167340; --ph5:#005A2E; --ph6:#003D1E;
  --r:8px;
  --font:"Barlow","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#DDE1E4}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}

/* ---------- Bühne ---------- */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--white);
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;
  display:grid;grid-template-rows:64px minmax(0,1fr) 52px;grid-template-columns:minmax(0,1fr);overflow:hidden}

/* ---------- B1 Kopfzeile ---------- */
.hdr{display:flex;align-items:center;gap:16px;padding:0 20px 0 24px;border-bottom:3px solid var(--green);background:var(--white);white-space:nowrap}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.wordmark{font-weight:800;font-size:24px;letter-spacing:.06em;color:var(--green);line-height:1}
.brand .sep{width:1px;height:28px;background:var(--line)}
.app-title{font-size:18px;font-weight:600}
.app-title small{display:block;font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.hdr-center{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.kw{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--line);background:var(--white)}
.icon-btn svg{width:16px;height:16px}
.kw-label{font-size:22px;font-weight:700;padding:0 6px;min-width:84px;text-align:center}
.kw-range{font-size:15px;font-weight:600;color:var(--text-2);margin-left:6px}
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--green-dk);border-color:var(--green-dk);color:var(--white)}
.btn.pri:disabled{background:#AEB5BB;border-color:#AEB5BB;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.seg{display:inline-flex;height:36px;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--surface)}
.seg button{min-width:58px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--white);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.tabs{display:flex;align-self:stretch}
.tabs button{position:relative;padding:0 11px;font-size:15px;font-weight:600;color:var(--text-2)}
.tabs button.on{color:var(--text)}
.tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-3px;height:3px;background:var(--green-dk)}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--st-ab);color:var(--white);
  font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--white);box-sizing:content-box}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text-2)}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--st-an);box-shadow:0 0 0 3px rgba(46,158,79,.18)}
.clock{font-size:22px;font-weight:700;min-width:58px;text-align:right}
.role{height:36px;padding:0 12px 0 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.role span{width:24px;height:24px;border-radius:50%;background:var(--text);display:grid;place-items:center}
.role svg{width:14px;height:14px}
.vsep{width:1px;height:28px;background:var(--line);flex:none}

/* ---------- Ansichten ---------- */
.views{min-height:0;position:relative}
.view{height:100%}
.main{display:grid;grid-template-columns:352px minmax(0,1fr) 528px;gap:12px;padding:12px 16px}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{height:36px;flex:none;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ph h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.ph .sub{font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.ph .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.count{min-width:24px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.st-an{background:var(--st-an)} .st-sc{background:var(--st-sc)} .st-ex{background:var(--st-ex)}
.st-dr{background:var(--st-dr)} .st-ab{background:var(--st-ab)}

/* ---------- Personenbild (Platzhalter-Foto) ---------- */
.ph-img{position:relative;flex:none;display:block;border-radius:6px;background-color:var(--surface-2);background-size:cover;background-position:center}
.ph-img .sd{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--white)}
.ph-img.lead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 6px 6px;background:var(--green)}
.av{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;border:2px solid var(--white);box-sizing:content-box}

/* ---------- B2 Personal ---------- */
.pool{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.sect{border-radius:var(--r);background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s}
.sect-h{height:24px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sect-h i{width:12px;height:12px;border-radius:50%}
.sect-h .hint{margin-left:auto;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text-2)}
.sect.drop-ok{box-shadow:0 0 0 3px var(--green)}
.sect.ab.drop-ok{box-shadow:0 0 0 3px var(--st-ab)}
.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:6px}
.dept{background:var(--white);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.dept.full{grid-column:1 / -1}
.dept-h{height:18px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;background:var(--green-dk);color:var(--white);
  font-size:11px;font-weight:700;letter-spacing:.1em;border-radius:7px 7px 0 0}
.dept-h b{font-weight:600;opacity:.85;letter-spacing:0}
.sect.ab .dept-h{background:#8A939B}
.phs{display:flex;flex-wrap:wrap;gap:4px;padding:5px 4px 4px}
.pt{width:42px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;touch-action:manipulation;border-radius:6px;position:relative}
.pt .ph-img{width:42px;height:42px}
.pt .cap{font-size:10.5px;font-weight:700;max-width:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:12px}
.pt.abs .ph-img{filter:grayscale(1);opacity:.6}
.pt .why{position:absolute;left:-1px;right:-1px;top:28px;height:14px;border-radius:0 0 6px 6px;font-size:8px;font-weight:800;letter-spacing:0;
  color:var(--white);display:grid;place-items:center;text-transform:uppercase}
.pt .svc{position:absolute;left:-1px;right:-1px;top:28px;height:14px;border-radius:0 0 6px 6px;background:var(--st-ex);font-size:8.5px;font-weight:800;color:var(--white);display:grid;place-items:center;letter-spacing:.04em}
.pt.sel .ph-img{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--green)}
.pt.sel{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,137,61,.35)}50%{box-shadow:0 0 0 6px rgba(0,137,61,0)}}
.dim .pt:not(.hit){opacity:.28}
.dim .pt.hit .ph-img{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--green-dk)}
.dragging{opacity:.35}
.drop-note{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:8px;font-size:12px;font-weight:600;color:var(--text-2);text-align:center}

/* Tabelle Anwesend | Abwesend */
.ptab{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.pt-h,.prow{display:grid;grid-template-columns:40px minmax(0,1fr) 120px}
.pt-h{height:36px;background:var(--surface);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pt-h > span{display:flex;align-items:center;gap:5px;padding:0 6px;min-width:0}
.pt-h > span:first-child{font-size:10.5px;color:var(--text-2);letter-spacing:.04em}
.pt-h i{width:10px;height:10px;border-radius:50%;flex:none}
.pt-h .count{margin-left:auto;min-width:20px;padding:0 5px}
.pt-h .c-ab{letter-spacing:.02em}
.pt-h .c-ab,.prow .c-ab{border-left:1px solid var(--line)}
.prow{border-bottom:1px solid #EEF0F2}
.prow:last-child{border-bottom:0}
.prow .dl{padding:8px 0 0 6px;line-height:13px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--green-dk);border-right:1px solid #EEF0F2;background:#FAFBFB}
.prow .c-an,.prow .c-ab{display:flex;flex-wrap:wrap;gap:4px;padding:5px 5px;align-content:flex-start;min-height:62px;min-width:0}
.prow .c-ab{background:#F8F9FA}
.prow .none{color:var(--text-3);font-size:13px;font-weight:700;padding:16px 0 0 38px}
.c-an.drop-ok{background:var(--green-lt)!important;box-shadow:inset 0 0 0 2px var(--green)}
.c-ab.drop-ok{background:#FDECEE!important;box-shadow:inset 0 0 0 2px var(--st-ab)}
.ptab.flash{animation:flash 1.4s ease-out 2}

/* Projektliste: Firmenlogo + Status */
.plist2{display:flex;flex-direction:column;gap:6px}
.pc2{position:relative;height:54px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);display:flex;align-items:center;gap:10px;cursor:grab;min-width:0}
.pc2 > .mk{width:32px;height:32px;flex:none}
.pc2 .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.pc2 .tx b{font-size:14px;font-weight:800;letter-spacing:.05em;white-space:nowrap}
.pc2 .tx span{font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .tag{position:static;flex:none;height:22px;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pc2.focus{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.pc2.drop-ok{border-color:var(--green);box-shadow:0 0 0 3px var(--green),0 0 16px rgba(0,137,61,.35)}
.stat{flex:none;height:26px;padding:0 10px 0 8px;border-radius:13px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid}
.stat i{width:10px;height:10px;border-radius:50%}
.stat.g{background:#EAF6EE;border-color:#BFE0CA;color:#1E6B37} .stat.g i{background:var(--amp-g)}
.stat.y{background:#FCF1CC;border-color:#E9C65A;color:#6B4E00} .stat.y i{background:var(--amp-y)}
.stat.r{background:#FBE3E6;border-color:#E9A3AC;color:#9E1528} .stat.r i{background:var(--amp-r)}
.svcbox{display:flex;flex-wrap:wrap;gap:10px;padding:8px;border:1px solid var(--line);border-radius:var(--r);min-height:84px}
.svcbox.drop-ok{border-color:var(--st-ex);box-shadow:inset 0 0 0 2px var(--st-ex)}
.svcbox .t{font-size:12px;font-weight:600;color:var(--text-3)}
.pt.svcp{width:64px}
.pt.svcp .ph-img{width:48px;height:48px}
.pt .cu{font-size:9.5px;font-weight:700;color:var(--text-2);letter-spacing:.04em;white-space:nowrap}

/* ---------- B3 Hallenplan ---------- */
.legend-mini{display:flex;gap:12px;font-size:12px;font-weight:600;color:var(--text-2)}
.legend-mini span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend-mini i{width:18px;height:12px;border-radius:3px;display:inline-block}
.sw-ex{background:var(--white);border:2px solid var(--green-dk)}
.sw-in{background:var(--white);border:2px dashed var(--green-dk)}
.sw-fl{background:var(--white);border:1.5px dashed #9AA3AB}
.mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.map{position:relative;width:100%;aspect-ratio:6/5;max-height:100%;background:var(--surface-2);border:4px solid #5F6870;border-radius:4px;touch-action:none}
.gate{position:absolute;height:8px;background:var(--white);z-index:2}
.gate-l{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--text-2);transform:translateX(-50%);white-space:nowrap}
.aisle{position:absolute;display:grid;place-items:center;pointer-events:none}
.aisle span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;letter-spacing:.4em;color:#8F989F}
.fl{position:absolute;background-color:var(--white);border:1.5px dashed #9AA3AB;border-radius:6px;cursor:crosshair}
.fl-l{position:absolute;left:2px;top:-22px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--text-2);pointer-events:none;text-transform:uppercase}
.fl-l small{font-weight:600;letter-spacing:0;text-transform:none;margin-left:6px}
.fl-hint{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8F989F;font-size:13px;font-weight:700;text-align:center;pointer-events:none;line-height:1.35}
.fl-hint svg{width:46px;height:46px}
.fl.drop-ok{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.ghost{position:absolute;border:2px dashed var(--green-dk);background:rgba(0,137,61,.10);border-radius:6px;z-index:8;pointer-events:none;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:var(--green-dk)}
.ghost.bad{border-color:var(--st-ab);background:rgba(215,38,61,.08);color:#B3182C}
.pr{position:absolute;z-index:4;background:#FBFDFC;border:2px solid var(--green-dk);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;
  overflow:hidden;cursor:move;min-width:0}
.pr.in{border-style:dashed;background:var(--white)}
.pr .co{display:flex;align-items:center;gap:7px;min-width:0}
.pr .co .mk{width:30px;height:30px;flex:none}
.pr .co b{font-size:14.5px;font-weight:800;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .nr2{font-size:11.5px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .pn{font-size:15px;font-weight:700;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .ft{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-width:0}
.pr .cnt{font-size:12px;font-weight:800;white-space:nowrap;padding:1px 6px;border-radius:4px;background:var(--surface)}
.pr .cnt.under{background:#FBE3E6;color:#9E1528}
.pr .cnt.over{background:#FDE8D4;color:#8A4200}
.pr .dim-m{position:absolute;left:8px;bottom:-1px;font-size:10.5px;font-weight:700;color:var(--green-dk);background:var(--green-lt);padding:0 5px;border-radius:4px 4px 0 0;display:none}
.pr.sel{box-shadow:0 0 0 3px rgba(0,137,61,.35),0 10px 22px rgba(31,35,40,.18);z-index:6}
.pr.sel .dim-m{display:block}
.pr.bad{border-color:var(--st-ab)!important;box-shadow:0 0 0 3px rgba(215,38,61,.3)}
.pr.drop-ok{box-shadow:0 0 0 3px var(--green),0 0 18px rgba(0,137,61,.45);z-index:6}
.pr.focus{box-shadow:0 0 0 3px var(--green),0 0 0 7px rgba(0,137,61,.18)}
.pr .rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--green-dk) 50%);display:none}
.pr .del{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:6px;background:var(--white);border:1px solid var(--line);display:none;place-items:center;color:var(--text-2)}
.pr .del svg{width:14px;height:14px}
.pr.sel .rz{display:block} .pr.sel .del{display:grid}
.stk{display:flex;padding-left:6px;min-width:0;overflow:hidden}
.stk .av{margin-left:-6px;width:24px;height:24px}
.stk .more{margin-left:-4px;height:24px;min-width:28px;padding:0 5px;border-radius:12px;background:var(--surface);border:2px solid var(--white);font-size:11px;font-weight:800;color:var(--text-2);display:grid;place-items:center}

/* ---------- B4 Projektarten ---------- */
.proj{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{height:24px;flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:2px}
.sec-h h3{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.sec-h .hint{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-2)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc{position:relative;height:104px;padding:9px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;gap:5px;min-width:0;cursor:grab}
.pc.under{border-left:4px solid var(--st-ab);padding-left:7px}
.pc.focus{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.pc.drop-ok{border-color:var(--green);box-shadow:0 0 0 3px var(--green),0 0 16px rgba(0,137,61,.35)}
.pc .co{display:flex;align-items:center;gap:6px;min-width:0}
.pc .co .mk{width:18px;height:18px;flex:none}
.pc .co b{font-size:11px;font-weight:800;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .co .nr{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--text-2);white-space:nowrap}
.pc .pn{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.pc .pn span{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:12px;font-weight:800;white-space:nowrap;padding:1px 6px;border-radius:4px;background:var(--surface)}
.cnt.under{background:#FBE3E6;color:#9E1528}
.cnt.over{background:#FDE8D4;color:#8A4200}
.pc .ppl{margin-top:auto;display:flex;align-items:center;gap:3px;min-height:28px}
.pc .ppl .ph-img{width:26px;height:26px;border-radius:5px;cursor:grab}
.pc .ppl .ph-img .sd{width:9px;height:9px;right:-2px;bottom:-2px}
.pc .ppl .none{font-size:12px;font-weight:600;color:var(--text-3)}
.pc .tag{position:absolute;right:8px;bottom:9px;height:20px;padding:0 7px;border-radius:10px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.plan{border:1.5px dashed var(--green-dk);color:var(--green-dk);background:var(--green-lt)}
.tag.kunde{border:1px solid var(--line-2);color:var(--text-2);background:var(--surface)}
.tag svg{width:11px;height:11px}
.ohne{border:1.5px dashed var(--line-2);border-radius:var(--r);min-height:40px;padding:6px 10px;display:flex;align-items:center;gap:8px;flex:none}
.ohne.has{border-color:var(--warn);background:#FFF6EE}
.ohne .l{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.ohne .ph-img{width:28px;height:28px;cursor:grab}
.ohne .t{font-size:12px;font-weight:600;color:var(--text-3)}
.ohne.drop-ok{border-color:var(--green);background:var(--green-lt)}
.flash{animation:flash 1.4s ease-out 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(0,137,61,0)}30%{box-shadow:0 0 0 4px rgba(0,137,61,.55)}}

/* Logo-Wortmarken (fiktiv) */
.logo{flex:none;font-size:10px;line-height:14px;color:var(--text);white-space:nowrap}
.mk{display:inline-block;color:var(--text)}
.mk svg{width:100%;height:100%;display:block}

/* Pop-up: Projektliste beim Platzieren */
.plist{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.plist button{min-height:48px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);display:flex;align-items:center;gap:10px;text-align:left}
.plist button:hover{border-color:var(--green)}
.plist .mk{width:26px;height:26px}
.plist .tx{display:flex;flex-direction:column;min-width:0}
.plist .tx b{font-size:14px;font-weight:700}
.plist .tx span{font-size:11.5px;font-weight:600;color:var(--text-2)}
.plist .st{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;white-space:nowrap}
.plist .st.neu{background:var(--green-lt);color:var(--green-dk);border:1px dashed var(--green-dk)}
.plist .st.mv{background:var(--surface);color:var(--text-2);border:1px solid var(--line)}

/* gemeinsam genutzt (Forecast, Pop-up) */
.phase{height:22px;padding:0 8px;border-radius:4px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.phase i{width:8px;height:8px;border-radius:2px}
.qcd{display:flex;gap:4px}
.qcd span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--text)}
.qcd .g{background:var(--amp-g)} .qcd .y{background:var(--amp-y)} .qcd .r{background:var(--amp-r);color:var(--white)}
.track{position:relative;height:8px;border-radius:4px;background:#E6E8EA}
.track > i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.f-g{background:var(--amp-g)} .f-y{background:var(--amp-y)} .f-r{background:var(--amp-r)} .f-n{background:var(--text-2)}

/* ---------- B5 Fußleiste ---------- */
.ftr{display:flex;align-items:center;gap:14px;padding:0 16px 0 24px;border-top:1px solid var(--line);background:var(--white)}
.lg{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.lg .t{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text);text-transform:uppercase}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg span > i{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg .amp{width:20px;height:20px;border-radius:50%;border:1.5px solid #8C959D;display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:var(--text)}
.kpis{margin-left:auto;display:flex;gap:6px}
.kpi{height:40px;padding:0 8px 0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--white);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.kpi .k{font-size:13px;font-weight:600;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:800}
.kpi .v small{font-size:13px;font-weight:700;color:var(--text-2)}
.kpi svg{width:14px;height:14px;color:#9AA3AB}
.kpi .dot{width:10px;height:10px;border-radius:50%}
.kpi.alert{border-color:var(--st-ab);background:#FDECEE}
.kpi.alert .k{color:#8E1424} .kpi.alert .v{color:#B3182C} .kpi.alert svg{color:#B3182C}

/* ---------- Snackbar / Toast ---------- */
.snack{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:70;height:52px;padding:0 8px 0 18px;border-radius:var(--r);
  background:var(--text);color:var(--white);display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(31,35,40,.3);overflow:hidden;transition:opacity .2s,transform .2s}
.snack.hide{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.snack .ok{width:22px;height:22px;border-radius:50%;background:var(--st-an);display:grid;place-items:center;flex:none}
.snack .ok.warn{background:var(--st-ab)}
.snack .ok svg{width:13px;height:13px}
.snack .msg{font-size:16px;font-weight:600;white-space:nowrap}
.snack .msg b{font-weight:800}
.snack .msg .mail{color:#B9C1C8;font-weight:600;font-size:14px;margin-left:4px}
.snack .div{width:1px;height:24px;background:rgba(255,255,255,.22)}
.snack .undo{height:40px;padding:0 14px;border-radius:6px;color:#7FD9A3;font-size:14px;font-weight:800;letter-spacing:.1em;display:inline-flex;align-items:center;gap:8px}
.snack .undo svg{width:16px;height:16px}
.snack .timer{position:absolute;left:0;bottom:0;height:3px;width:62%;background:#7FD9A3;opacity:.7}

/* ---------- Pop-ups ---------- */
.pop{position:absolute;z-index:75;width:388px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 18px 44px rgba(31,35,40,.24),0 2px 6px rgba(31,35,40,.12);padding:16px;display:flex;flex-direction:column;gap:14px}
.pop-h{display:flex;align-items:center;gap:12px}
.pop-h .av{width:44px;height:44px;font-size:15px}
.pop-h .av .sd{width:14px;height:14px;right:-1px;bottom:-1px;border-width:3px}
.pop-h .nm{font-size:20px;font-weight:700;line-height:24px}
.pop-h .meta{font-size:13px;font-weight:600;color:var(--text-2)}
.pop-h .x{margin-left:auto;align-self:flex-start}
.pl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin-bottom:6px;display:flex;justify-content:space-between}
.pl span{letter-spacing:0;text-transform:none;font-weight:600}
.statline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.statline i{width:12px;height:12px;border-radius:50%}
.statline span{font-weight:600;color:var(--text-2)}
.einsatz{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.einsatz .r1{display:flex;align-items:center;gap:8px}
.zchip{height:24px;min-width:34px;padding:0 7px;border-radius:4px;background:var(--green-dk);color:var(--white);font-size:13px;font-weight:800;display:inline-grid;place-items:center}
.zchip.fb{background:var(--green-lt);color:var(--green-dk);border:1px solid var(--green-ln)}
.kl{height:18px;padding:0 6px;border-radius:9px;border:1px solid var(--line-2);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);display:inline-flex;align-items:center}
.einsatz .nm2{font-size:15px;font-weight:700}
.einsatz .r2{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text-2)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{height:36px;padding:0 10px;border-radius:var(--r);border:1px solid var(--green);background:var(--green-lt);color:var(--green-dk);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ausl{display:flex;align-items:center;gap:12px}
.ausl .big{font-size:28px;font-weight:800;line-height:1}
.ausl .big small{font-size:15px}
.ausl .tr{flex:1}
.ausl .tr .track{height:10px}
.ausl .tr div{font-size:12px;font-weight:600;color:var(--text-2);margin-top:5px;display:flex;justify-content:space-between}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.day{height:52px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day .d{font-size:10.5px;font-weight:700;color:var(--text-2);letter-spacing:.04em}
.day .c{font-size:13px;font-weight:800}
.day .h{font-size:10.5px;font-weight:600;color:var(--text-2)}
.day.today{border:2px solid var(--green);background:var(--white)}
.day.plan{background:var(--white);border-style:dashed}
.day.free .c{color:var(--text-3)}
.day.off .c{font-size:11px;letter-spacing:.04em}
.stbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stbtns button{height:52px;border-radius:6px;border:1px solid var(--line);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:11.5px;font-weight:700;color:var(--text);line-height:1.1;text-align:center;padding:0 2px}
.stbtns button i{width:12px;height:12px;border-radius:50%;flex:none}
.stbtns button.cur{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.stbtns button.pend{border:2px solid var(--green-dk);background:var(--green-lt)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:32px;padding:0 10px;border-radius:16px;border:1px solid var(--line-2);background:var(--white);font-size:12.5px;font-weight:700;color:var(--text)}
.chips button.on{background:var(--text);color:var(--white);border-color:var(--text)}
.conseq{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--text)}
.conseq ul{margin:0;padding-left:18px;color:var(--text-2);font-weight:600}
.conseq ul b{color:var(--text)}
.conseq li{margin:2px 0}
.pop-f{display:flex;gap:8px;justify-content:flex-end}
.pop-f .btn{height:40px}
.pop-f .lft{margin-right:auto}

.menu{position:absolute;z-index:65;width:420px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 44px rgba(31,35,40,.24);overflow:hidden}
.menu-h{height:48px;padding:0 8px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.menu-h h4{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nt{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 16px;border-bottom:1px solid #EEF0F2;align-items:start}
.nt.unread{background:#F7FBF8}
.nt .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.nt .ic svg{width:15px;height:15px}
.nt .ic.alert{background:#FBE3E6;color:#B3182C} .nt .ic.warn{background:#FCF1CC;color:#6B4E00} .nt .ic.mail{background:var(--green-lt);color:var(--green-dk)}
.nt .tt{font-size:14px;font-weight:700}
.nt .tx{font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:2px}
.nt .tm{font-size:12px;font-weight:600;color:var(--text-3)}
.menu-f{padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.menu-f svg{width:14px;height:14px}

.backdrop{position:absolute;inset:0;z-index:80;background:rgba(31,35,40,.35);display:grid;place-items:center}
.modal{width:560px;background:var(--white);border-radius:var(--r);box-shadow:0 24px 60px rgba(31,35,40,.3);padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h3{margin:0;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.modal p{margin:0;font-size:14px;color:var(--text-2);font-weight:500}
.field{display:flex;gap:8px}
.field input{flex:1;height:44px;border:1.5px solid var(--line-2);border-radius:var(--r);padding:0 14px;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--text);outline:none}
.field input:focus{border-color:var(--green)}
.field .btn{height:44px}
.preview{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.preview .full{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.preview .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.preview .v{font-size:15px;font-weight:700}
.preview .nm{font-size:18px;font-weight:700}
.nf{font-size:14px;font-weight:600;color:#B3182C}

.toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:90;height:40px;padding:0 16px;border-radius:20px;background:var(--text);color:var(--white);
  font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;transition:opacity .2s;white-space:nowrap}
.toast.hide{opacity:0;pointer-events:none}
.tip{position:absolute;z-index:95;max-width:300px;padding:7px 10px;border-radius:6px;background:var(--text);color:var(--white);font-size:12.5px;font-weight:600;line-height:1.35;pointer-events:none;white-space:pre-line}

/* ---------- Forecast ---------- */
.vpad{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.ktiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:none}
.ktile{height:104px;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;justify-content:space-between;background:var(--white);min-width:0}
.ktile .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);display:flex;justify-content:space-between;gap:8px}
.ktile .v{font-size:32px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:8px}
.ktile .v small{font-size:15px;font-weight:700;color:var(--text-2)}
.ktile .s{font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktile .f{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0;text-transform:none;white-space:nowrap}
.fc{flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.fc-row{display:grid;grid-template-columns:232px 220px 164px 140px 168px minmax(0,1fr);align-items:center;border-bottom:1px solid #EEF0F2}
.fc-row > div{padding:0 12px;min-width:0}
.fc-head{height:48px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.fc-head > div small{display:block;font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--text-3)}
.fc-sec{height:26px;flex:none;padding:0 12px;display:flex;align-items:center;gap:8px;background:#FAFBFB;border-bottom:1px solid #EEF0F2;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.fc-row.r{height:62px;flex:none;cursor:pointer}
.fc-row.r:hover{background:#FAFBFB}
.fc-row.hl{background:var(--green-lt)!important;box-shadow:inset 4px 0 0 var(--green)}
.fc-p .nm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-p .nr{font-size:12px;font-weight:600;color:var(--text-2);display:flex;gap:6px;align-items:center;margin-top:3px}
.l1{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.l1 em{font-style:normal;font-weight:600;color:var(--text-2)}
.l2{font-size:11.5px;font-weight:600;color:var(--text-2);margin-top:4px;white-space:nowrap}
.hbar{position:relative;height:10px;border-radius:5px;background:#E6E8EA;margin-top:6px}
.hbar .ist{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--text-2)}
.hbar .ext{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--text) 0 2px,transparent 2px 5px);border-radius:0 5px 5px 0;opacity:.55}
.hbar .plan{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--green-dk)}
.amp1{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.amp1.g{background:var(--amp-g)} .amp1.y{background:var(--amp-y)} .amp1.r{background:var(--amp-r)}
.fc-g{position:relative;align-self:stretch;padding:0!important;border-left:1px solid #EEF0F2}
.gscale{position:absolute;inset:0 16px 0 8px}
.gscale .m{position:absolute;top:7px;font-size:11px;font-weight:700;color:var(--text);letter-spacing:.06em}
.gscale .w{position:absolute;bottom:6px;font-size:10px;font-weight:600;color:var(--text-3);transform:translateX(-50%);letter-spacing:0}
.gscale .w.now{color:var(--green-dk);font-weight:800}
.gline{position:absolute;top:0;bottom:0;width:1px;background:#F0F2F3}
.gline.mo{background:#DDE1E4}
.gtoday{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--green);z-index:2}
.gbar{position:absolute;top:50%;height:20px;transform:translateY(-50%);display:flex}
.gseg{height:100%;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--white);overflow:hidden;border-right:2px solid var(--white)}
.gseg:first-child{border-radius:4px 0 0 4px}
.gseg:last-child{border-radius:0 4px 4px 0;border-right:0}
.gseg.dk{color:var(--text)}
.gseg.cur{box-shadow:inset 0 0 0 2px var(--text)}
.gseg.overdue{box-shadow:inset 0 0 0 2px var(--st-ab)}
.gext{position:absolute;top:50%;height:20px;transform:translateY(-50%);border-radius:0 4px 4px 0;z-index:1}
.gext.y{background:repeating-linear-gradient(135deg,#E9B82E 0 3px,#FCF1CC 3px 7px);border:1px solid #D9A92A}
.gext.r{background:repeating-linear-gradient(135deg,#D7263D 0 3px,#FBE3E6 3px 7px);border:1px solid #C21F35}
.glbl{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;white-space:nowrap;z-index:3}
.fc-foot{height:40px;flex:none;margin-top:auto;padding:0 12px;display:flex;align-items:center;gap:16px;font-size:12px;font-weight:600;color:var(--text-2);border-top:1px solid var(--line);background:var(--surface)}
.fc-foot span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fc-foot .sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.fc-foot b{color:var(--text)}

/* ---------- Auswertung ---------- */
.agrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chart{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;display:flex;flex-direction:column;min-height:0}
.chart h4{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.chart h4 span{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text-2)}
.chart .cs{font-size:12.5px;font-weight:600;color:var(--text-2);margin:3px 0 6px}
.chart svg{flex:1;min-height:0;width:100%;display:block}
.chart svg text{font-family:var(--font);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:rgba(31,35,40,.04)}
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.stackbar i{height:100%}

/* Tabellenziffern nur für Zahlen – Namen und Wortmarken proportional */
.kn,.t-top .nm,.logo,.pn,.mn,.zl,.app-title,.fc-p .nm,.pop-h .nm,.einsatz .nm2,.preview .nm{font-variant-numeric:normal}
@media (prefers-reduced-motion:reduce){.pt.sel,.flash{animation:none}}
</style>

<body>
<div id="stage">

  <!-- ============================== B1 KOPFZEILE ============================== -->
  <header class="hdr">
    <div class="brand">
      <span class="wordmark">SCHAEFFLER</span><span class="sep"></span>
      <div class="app-title">Montageplanung SMB<small>Halle 3 · Montage</small></div>
    </div>
    <div class="hdr-center">
      <div class="kw">
        <button class="icon-btn" data-kw="-1" aria-label="Vorherige Woche"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3 5 8l5 5"/></svg></button>

/* ---------- Abgeleitete Werte ---------- */
const istAnw = p => p.s==='an' || p.s==='ex';
const leute = nr => MITARBEITER.filter(p=>istAnw(p) && ZUTEILUNG[p.id]===nr);
const ist = pr => leute(pr.nr).length;
const imPlan = pr => !!PLAN[pr.nr];
function flaecheVon(r){ return FLAECHEN.find(f=>r.x>=f.x && r.y>=f.y && r.x+r.w<=f.x+f.w && r.y+r.h<=f.y+f.h); }
const hits = (a,b) => a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
function freiePos(f0, w, h, cx, cy, ohne){
  let best=null, bd=1e9;
  [f0, ...FLAECHEN.filter(x=>x!==f0)].forEach((F,i)=>{
    for(let y=F.y; y<=F.y+F.h-h; y++) for(let x=F.x; x<=F.x+F.w-w; x++){
      const r={x,y,w,h}; if(!frei(r,ohne)) continue;
      const d=(x+w/2-cx)**2+(y+h/2-cy)**2+(i?900:0); if(d<bd){ bd=d; best=r; }
    }
  });
  return best;
}
function frei(r, ohne){ return !Object.entries(PLAN).some(([nr,o])=>nr!==ohne && hits(r,o)); }
function forecast(pr){
  const prog = pr.pct ? Math.round(pr.ist/(pr.pct/100)) : pr.plan;
  const delta = prog - pr.plan, dPct = delta/pr.plan*100, kosten = Math.max(0,delta)*STUNDENSATZ;
  const C = dPct<=5 ? 'g' : dPct<=15 ? 'y' : 'r';
  const Dm = pr.verzug ? (pr.verzug.ist ? 'r' : 'y') : 'g';
  const ende = pr.verzug ? plusAT(pr.to, pr.verzug.at) : D(pr.to);
  return {prog, delta, dPct, kosten, amp:pr.q+C+Dm, ende, stdPct:Math.round(pr.ist/pr.plan*100)};
}
const rank = pr => { const a=forecast(pr).amp; return a.includes('r')?0:a.includes('y')?1:2; };
function grundText(p){
  if(p.s==='ab') return p.grund==='Krank' ? `krank seit ${p.seit||dstr(HEUTE)}` : `Urlaub bis ${p.bis||'—'}`;
  if(p.s==='dr') return `Dienstreise bis ${p.bis||'—'}`;
  if(p.s==='sc') return `Schulung bis ${p.bis||'—'}`;
  if(p.s==='ex') return `beim Kunden bis ${p.bis||'—'}`;
  return '';
}
const why = p => p.s==='ab' ? (p.grund||'Abw.') : p.s==='dr' ? 'Reise' : 'Schulung';
function personTip(p){
  const pr = PR(ZUTEILUNG[p.id]);
  return `${p.n} · ${p.t}${p.lead?' · Vorarbeiter':''}\n${STATUS[p.s].lang||STATUS[p.s].l}${istAnw(p)?'':' – '+grundText(p)}\n${pr?pr.nr+' '+pr.nm:(istAnw(p)?'ohne Projekt':'')}`;
}
const mk = (c,cls='mk') => `<span class="${cls}">${LOGO[c].svg}</span>`;
const foto = (p,cls='') => `<span class="ph-img ph-${p.id} ${p.lead?'lead':''} ${cls}"><i class="sd ${STATUS[p.s].c}"></i></span>`;

/* =============================================================================
   Pop-ups: Person (Einsatz, Auslastung, Status) und Projekt platzieren
   ============================================================================= */
const STATUS_BTN = [['an',null,'Anwesend'],['ex',null,'Ext.<br>Service'],['ab','Krank','Krank'],['ab','Urlaub','Urlaub'],['dr',null,'Dienst-<br>reise'],['sc',null,'Schulung']];
function wochenplan(p){
  const kurz = nr => nr ? nr.replace('P-','').replace('I-','I-') : '—';
  const jetzt = kurz(ZUTEILUNG[p.id]), vorher = kurz(p.vorh||ZUTEILUNG[p.id]);
  return ['Mo','Di','Mi','Do','Fr'].map((d,i)=>{
    const plan = i===4 ? 6 : 8; let c, hrs = plan, cls = i<2 ? '' : i===2 ? 'today' : 'plan';
    if(i<2) c = vorher;
    else if(!istAnw(p)){ c = why(p).toUpperCase(); cls += ' off'; hrs = 0; }
    else c = jetzt;
    if(c==='—'){ cls+=' free'; hrs=0; }
    return {d,c,h:hrs,cls};
  });
}
function personPop(){
  const P = S.pop, p = byId[P.pid], nr = ZUTEILUNG[p.id], pr = PR(nr);
  const wk = wochenplan(p), eing = wk.reduce((s,x)=>s+x.h,0), ausl = Math.round(eing/38*100), geb = wk[0].h+wk[1].h+(wk[2].h?4.5:0);
  let einsatz;
  if(pr){
    const r = PLAN[pr.nr], f = r && flaecheVon(r);
    einsatz = `<div class="einsatz"><div class="r1">${mk(pr.c,'mk" style="width:24px;height:24px')}<span class="nm2">${pr.nm}</span><span class="kl" style="margin-left:auto">${pr.kl}</span></div>
      <div class="r2"><span>${LOGO[pr.c].n} · ${pr.nr} · Phase ${pr.cur}</span><span>Ist ${ist(pr)} / Soll ${pr.soll}</span></div>
      <div class="r2"><span>${pr.kl==='service'?'beim Kunden – nicht im Hallenplan':f?`Hallenplan: ${f.n} (${r.w} × ${r.h} m)`:'noch nicht im Hallenplan platziert'}</span></div></div>`;

    const vor = PROJEKTE.filter(x=>x.kl!=='service' && ist(x)<x.soll);

    const it = [];
    if(s==='an'){ it.push(istAnw(p)?'bleibt anwesend':`wieder <b>anwesend</b> – erscheint unter „Ohne Projekt“${p.vorh?', Vorschlag: zurück zu <b>'+p.vorh+'</b>':''}`); }
    else if(s==='ex'){ if(pr && pr.kl!=='service') it.push(`Wird aus <b>${pr.nr}</b> genommen: Ist ${ist(pr)} → <b>${ist(pr)-1}</b> / Soll ${pr.soll}`);
      it.push(`zählt weiter als <b>anwesend</b>, ist aber <b>nicht im Hallenplan</b>`); if(P.target) it.push(`neu zugeteilt: <b>${P.target}</b> · Mail an Mitarbeiter`); }

   ============================================================================= */
function snapshot(){ S.hist.push(JSON.stringify({z:ZUTEILUNG, p:MITARBEITER.map(p=>({s:p.s,grund:p.grund??null,bis:p.bis??null,seit:p.seit??null,vorh:p.vorh??null})), plan:PLAN, m:MELDUNGEN})); }
function undo(){
  const last = S.hist.pop(); if(!last) return; const o = JSON.parse(last);
  Object.keys(ZUTEILUNG).forEach(k=>delete ZUTEILUNG[k]); Object.assign(ZUTEILUNG, o.z);
  MITARBEITER.forEach((p,i)=>Object.assign(p, o.p[i])); PLAN = o.plan; MELDUNGEN = o.m; renderAll();
}
function zuteilen(pid, nr){
  const p = byId[pid], pr = PR(nr); if(!p||!pr) return;
  if(ZUTEILUNG[pid]===nr && istAnw(p)) return;
  snapshot();
  const warAbw = !istAnw(p);
  if(ZUTEILUNG[pid]) p.vorh = ZUTEILUNG[pid];
  p.s = pr.kl==='service' ? 'ex' : 'an'; if(warAbw||p.s==='an'){ p.grund=p.seit=null; } if(p.s==='an') p.bis=null; if(p.s==='ex'&&!p.bis) p.bis='offen';
  ZUTEILUNG[pid] = nr; S.sel = null; closePop();
  melde('mail', `Mail an ${p.n} versendet`, `Zuteilung ${pr.nr} ${pr.nm}${pr.kl==='service'?' (externer Service)':''} ab ${dstr(HEUTE)}`);
  snack(`<b>${p.n}</b> → ${pr.nr} ${pr.nm}${warAbw?' (wieder anwesend)':''} <span class="mail">· ✉ Mitarbeiter informiert</span>`);
  renderAll();
}
function loesen(pid){
  const p = byId[pid]; snapshot();
  const warAbw = !istAnw(p); if(ZUTEILUNG[pid]) p.vorh = ZUTEILUNG[pid];
  delete ZUTEILUNG[pid]; p.s='an'; p.grund=p.bis=p.seit=null; S.sel=null; closePop();
  snack(`<b>${p.n}</b> → ${warAbw?'wieder anwesend · ':''}ohne Projekt`); renderAll();
}
function setzeStatus(pid, s, g, o){
  if(s==='an'){ loesen(pid); return; }
  if(s==='ex'){ zuteilen(pid, o.target); return; }
  const p = byId[pid]; snapshot();
  const pr = PR(ZUTEILUNG[pid]);
  if(ZUTEILUNG[pid]) p.vorh = ZUTEILUNG[pid];
  delete ZUTEILUNG[pid];
  p.s = s; p.grund = s==='ab' ? g : null; p.seit = (s==='ab'&&g==='Krank') ? dstr(HEUTE) : null;
  p.bis = ({'bis heute':dstr(HEUTE),'bis Fr 20.11.':'20.11.','bis 27.11.':'27.11.'}[o.bis]) || 'offen';
  const lbl = s==='ab' ? g : STATUS[s].l;
  let extra = '';
  if(pr){ melde('alert', `${lbl}: ${p.n}`, `${pr.nr} ${pr.nm} fehlt 1 Person · Ist ${ist(pr)} / Soll ${pr.soll} · Projektleitung informiert`);
          extra = ` · aus ${pr.nr} genommen <span class="mail">· PL benachrichtigt</span>`; }
  S.sel = null; closePop(); snack(`<b>${p.n}</b> → ${lbl}${extra}`, true); renderAll();
}
function platzieren(nr, r){
  const pr = PR(nr); snapshot(); const war = !!PLAN[nr];
  PLAN[nr] = {x:r.x,y:r.y,w:r.w,h:r.h}; S.ghost = null; S.selRect = nr; closePop();
  const f = flaecheVon(r);
  snack(`<b>${pr.nr} ${pr.nm}</b> → ${f.n} ${war?'verschoben':'platziert'} (${r.w} × ${r.h} m)`); renderAll();
}
function ausPlan(nr){ const pr=PR(nr); snapshot(); delete PLAN[nr]; S.selRect=null; snack(`<b>${pr.nr} ${pr.nm}</b> aus dem Hallenplan genommen`, true); renderAll(); }

let snackT, toastT;
function snack(html, warn){
  $('#snackMsg').innerHTML = html; $('#snackIc').classList.toggle('warn', !!warn);
  const sn = $('#snack'); sn.classList.remove('hide');
  const t = sn.querySelector('.timer'); t.style.transition='none'; t.style.width='100%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ t.style.transition='width 7s linear'; t.style.width='0%'; }));
  clearTimeout(snackT); snackT = setTimeout(()=>sn.classList.add('hide'), 7000);
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hide'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hide'),2800); }
const scale = () => parseFloat($('#stage').style.getPropertyValue('--s')) || 1;
function toStage(x,y){ const r=$('#stage').getBoundingClientRect(), s=scale(); return [(x-r.left)/s,(y-r.top)/s]; }
function moveTip(e){ const tip=$('#tip'); const [x,y]=toStage(e.clientX,e.clientY); tip.style.left=Math.min(x+14,1920-310)+'px'; tip.style.top=Math.min(y+18,1030)+'px'; }
document.addEventListener('mouseover', e=>{
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if(!t){ tip.hidden=true; return; }

});

const G0 = new Date(2026,7,31), G1 = new Date(2027,1,8);                  // KW 36 – KW 06
const DAY = 100/((G1-G0)/864e5);
const gx = d => (d - G0) / (G1 - G0) * 100;
function kw(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function renderForecast(){
  const v = $('#v-forecast');
  const F = PROJEKTE.map(p=>({p, f:forecast(p)}));
  const plan = F.reduce((s,x)=>s+x.p.plan,0), prog = F.reduce((s,x)=>s+x.f.prog,0);
  const mehrStd = F.reduce((s,x)=>s+Math.max(0,x.f.delta),0), kosten = mehrStd*STUNDENSATZ;
  const ok = F.filter(x=>x.f.amp[2]==='g').length, fc = F.filter(x=>x.f.amp[2]==='y').length, real = F.filter(x=>x.f.amp[2]==='r').length;
  const worst = F.slice().sort((a,b)=>b.f.dPct-a.f.dPct)[0];
  const ver = F.filter(x=>x.p.verzug);
  let scl = '', grid = '';
  let wi = 0;
  for(let d=new Date(G0); d<G1; d.setDate(d.getDate()+7), wi++){
    const x = gx(d), k = kw(d);
    grid += `<span class="gline" style="left:${x}%"></span>`;
    if((wi%2===1 && Math.abs(k-47)>1) || k===47) scl += `<span class="w ${k===47?'now':''}" style="left:${x+3.5*DAY}%">${k===47?'KW 47':k}</span>`;
  }
  for(let m=new Date(2026,8,1); m<G1; m.setMonth(m.getMonth()+1)){
    grid += `<span class="gline mo" style="left:${gx(m)}%"></span>`;
    scl += `<span class="m" style="left:calc(${gx(m)}% + 4px)">${['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'][m.getMonth()]}${m.getMonth()===0?' 27':''}</span>`;
  }
  const today = gx(HEUTE);
  const row = ({p,f})=>{
    const c = f.amp[1], dd = f.amp[2];
    const max = Math.max(p.plan, f.prog);
    const x0 = gx(D(p.ph[0][1])), x1 = gx(D(p.ph[p.ph.length-1][2])) + DAY;
    const segs = p.ph.map(([n,a,b])=>{
      const w = gx(D(b)) + DAY - gx(D(a));
      const i = PHASEN.indexOf(n)+1, overdue = p.verzug && p.verzug.ist && n===p.cur;
      return `<span class="gseg ${i<=2?'dk':''} ${n===p.cur?(overdue?'overdue':'cur'):''}" style="width:${w/(x1-x0)*100}%;background:var(--ph${i})" data-tip="${n}: ${a}–${b}${n===p.cur?' (aktuell)':''}${overdue?'\nüberfällig – '+p.verzug.txt:''}">${w>2.6?PH_KURZ[n]:''}</span>`;
    }).join('');
    let ext = '';
    if(p.verzug){ const xe = gx(f.ende)+DAY;
      ext = `<span class="gext ${dd}" style="left:${x1}%;width:${xe-x1}%" data-tip="${p.verzug.ist?'Tatsächlicher Verzug':'Prognose-Verzug'} +${p.verzug.at} AT → Ende ${dstr(f.ende)}\n${p.verzug.txt}"></span><span class="glbl" style="left:calc(${xe}% + 6px)">+${p.verzug.at} AT</span>`; }
    return `<div class="fc-row r ${S.hl===p.nr?'hl':''}" data-nr="${p.nr}">
      <div class="fc-p"><div class="nm">${p.nm}</div><div class="nr">${p.nr}<span class="phase" style="height:18px;font-size:10px;padding:0 6px"><i style="background:var(--ph${PHASEN.indexOf(p.cur)+1})"></i>${p.cur}</span></div></div>
      <div data-tip="Zeitprognose = gebuchte Std. ÷ Fortschritt\n${fmt(p.ist)} h ÷ ${p.pct} % = ${fmt(f.prog)} h">
        <div class="l1">${fmt(p.ist)} <em>/ ${fmt(p.plan)} h</em><span style="margin-left:auto">${f.dPct>=0?'+':''}${fmt(f.dPct,1)} %</span></div>
        <div class="hbar"><span class="ist" style="width:${p.ist/max*100}%"></span>${f.prog>p.plan?`<span class="ext" style="left:${p.plan/max*100}%;width:${(f.prog-p.plan)/max*100}%"></span>`:''}<span class="plan" style="left:${p.plan/max*100}%"></span></div>
        <div class="l2">Prognose ${fmt(f.prog)} h</div></div>
      <div><div class="l1">${p.pct} % <em>erledigt</em></div><div class="l2">Pakete ${p.pak[0]}/${p.pak[1]} · Std ${f.stdPct} %</div></div>
      <div data-tip="Mehrkosten = (Prognose − Plan-Std.) × ${STUNDENSATZ} €/h"><div class="l1"><span class="amp1 ${c}"></span>${f.delta>0?'+'+fmt(f.kosten)+' €':'im Plan'}</div><div class="l2">${f.delta>0?fmt(f.delta)+' h × '+STUNDENSATZ+' €':fmt(-f.delta)+' h Puffer'}</div></div>
      <div><div class="l1"><span class="amp1 ${dd}"></span>${dd==='g'?'im Zeitrahmen':dd==='y'?'Verzug Forecast':'Verzug tatsächlich'}</div><div class="l2">Ende ${p.to}${p.verzug?' → '+dstr(f.ende):''}</div></div>
      <div class="fc-g"><div class="gscale">${grid}<span class="gtoday" style="left:${today}%"></span>
        <div class="gbar" style="left:${x0}%;width:${x1-x0}%">${segs}</div>${ext}</div></div></div>`;
  };
  v.innerHTML = `
    <div class="ktiles">
      <div class="ktile"><div class="k">Zeit-Forecast <span class="f">gebuchte Std. ÷ Fortschritt</span></div><div class="v">${prog>=plan?'+':''}${fmt((prog/plan-1)*100,1)} %<small>Zeitbedarf ggü. Plan</small></div><div class="s">Prognose ${fmt(prog)} h · Plan ${fmt(plan)} h · max. ${worst.p.nr} +${fmt(worst.f.dPct,1)} %</div></div>
      <div class="ktile"><div class="k">Kosten-Forecast <span class="f">Stundenverzug × Stundensatz</span></div><div class="v">+${fmt(kosten)} €<small>Mehrkosten</small></div><div class="s">${fmt(mehrStd)} h Verzug × ${STUNDENSATZ} €/h über alle Projekte</div></div>
      <div class="ktile"><div class="k">Liefertreue-Forecast</div><div class="v">${ok} / ${F.length}<small>im Zeitrahmen</small></div><div class="s">${fc} Verzug im Forecast (gelb) · ${real} tatsächlicher Verzug (rot)</div></div>
      <div class="ktile"><div class="k">Zeitverzug Montage / IBN</div><div class="v">${ver.length}<small>Projekte</small></div><div class="s">${ver.map(x=>`${x.p.nr} ${x.p.cur} +${x.p.verzug.at} AT`).join(' · ')}</div></div>
    </div>
    <div class="fc">
      <div class="fc-row fc-head"><div>Projekt<small>Nr. · aktuelle Phase</small></div><div>Zeit<small>gebuchte / Plan-Std. · Prognose</small></div><div>Fortschritt<small>Aufgabenpakete</small></div><div>Kosten (C)<small>Mehrkosten</small></div><div>Liefertreue (D)<small>Plan- → Prognose-Ende</small></div>
        <div class="fc-g"><div class="gscale">${scl}<span class="gtoday" style="left:${today}%;top:auto;height:10px"></span></div></div></div>
      ${KLASSEN.map(([k,l])=>`<div class="fc-sec">${l}<span class="count">${F.filter(x=>x.p.kl===k).length}</span></div>`+F.filter(x=>x.p.kl===k).sort((a,b)=>rank(a.p)-rank(b.p)).map(row).join('')).join('')}
      <div class="fc-foot">
        <span><b>Phasen</b></span>${PHASEN.map((n,i)=>`<span><i class="sw" style="background:var(--ph${i+1})"></i>${n}</span>`).join('')}
        <span style="margin-left:8px"><i class="sw" style="background:repeating-linear-gradient(135deg,#E9B82E 0 3px,#FCF1CC 3px 7px)"></i>Verzug Forecast</span>
        <span><i class="sw" style="background:repeating-linear-gradient(135deg,#D7263D 0 3px,#FBE3E6 3px 7px)"></i>Verzug tatsächlich</span>
        <span><i class="sw" style="background:var(--green);width:3px;height:14px"></i>Heute ${dstr(HEUTE)}</span>
        <span style="margin-left:auto">Ampel D: <b>grün</b> im Zeitrahmen · <b>gelb</b> Verzug im Forecast · <b>rot</b> tatsächlicher Verzug</span>
      </div>
    </div>`;
}

const AUSW = {
  krankTeam:[['ZSA',3.1],['ZSA1',2.4],['ZSA2',4.8],['ZSA3',7.9],['ZSA4',3.5],['ZSAA',1.2],['ZSY/ZSC',2.0]],

};
const SW = 900, SH = 300;
function hbars(data, max, ticks, ref, refLbl, unit, tipFn){
  const L=74, R=130, T=18, B=22, step=(SH-T-B)/data.length, bh=Math.min(20, step-12);
  const x = v => L + v/max*(SW-L-R);
  let s = `<svg viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="xMinYMid meet">`;
  ticks.forEach(v=>{ s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${SH-B}" stroke="#EEF0F2"/><text x="${x(v)}" y="${SH-5}" font-size="11" fill="#7A838B" text-anchor="middle">${v}${unit}</text>`; });
  s+=`<line x1="${x(ref)}" x2="${x(ref)}" y1="${T-4}" y2="${SH-B}" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x(ref)+5}" y="${T-6}" font-size="11" font-weight="700" fill="#1F2328">${refLbl}</text>`;
  data.forEach((d,i)=>{ const y=T+i*step+(step-bh)/2, w=Math.min(x(d.v),SW-R+20)-L;
    s+=`<text x="${L-10}" y="${y+bh/2+4.5}" font-size="13" font-weight="700" fill="#1F2328" text-anchor="end">${d.l}</text>
        <rect x="${L}" y="${y}" width="${Math.max(w,2)}" height="${bh}" rx="4" fill="#00893D"/>
        <text x="${L+w+8}" y="${y+bh/2+4.5}" font-size="12.5" font-weight="700" fill="#1F2328">${d.txt}</text>
        <rect class="hit" x="0" y="${T+i*step}" width="${SW}" height="${step}" data-tip="${tipFn(d)}"/>`; });
  return s+'</svg>';
}
function renderAuswertung(){
  const v = $('#v-auswertung');
  const c1 = hbars(AUSW.krankTeam.map(([l,val])=>({l,v:val,txt:fmt(val,1)+' %'})), 10, [0,2,4,6,8,10], 4, 'Ziel ≤ 4 %', ' %', d=>`${d.l}: ${fmt(d.v,1)} % Krankheitsrate (Ø 4 Wochen)`);
  const L=48,R=24,T=24,B=24, kv=AUSW.krankVerlauf, xs=i=>L+i*(SW-L-R)/(kv.length-1), ys=val=>T+(1-val/6)*(SH-T-B);
  const peak = Math.max(...kv.map(k=>k[1]));
  let c2 = `<svg viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="xMinYMid meet">`;
  [0,2,4,6].forEach(g=>c2+=`<line x1="${L}" x2="${SW-R}" y1="${ys(g)}" y2="${ys(g)}" stroke="#EEF0F2"/><text x="${L-8}" y="${ys(g)+4}" font-size="11" fill="#7A838B" text-anchor="end">${g} %</text>`);
  c2 += `<line x1="${L}" x2="${SW-R}" y1="${ys(4)}" y2="${ys(4)}" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${SW-R}" y="${ys(4)-6}" font-size="11" font-weight="700" fill="#1F2328" text-anchor="end">Ziel ≤ 4 %</text>`;
  c2 += `<polyline fill="none" stroke="#00893D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${kv.map((d,i)=>xs(i)+','+ys(d[1])).join(' ')}"/>`;
  kv.forEach((d,i)=>{ c2+=`<text x="${xs(i)}" y="${SH-5}" font-size="11" fill="#7A838B" text-anchor="middle">KW ${d[0]}</text>`;
    if(i===0||i===kv.length-1||d[1]===peak) c2+=`<circle cx="${xs(i)}" cy="${ys(d[1])}" r="5" fill="#00893D" stroke="#fff" stroke-width="2"/><text x="${xs(i)}" y="${ys(d[1])-12}" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">${fmt(d[1],1)} %</text>`;
    c2+=`<rect class="hit" x="${xs(i)-(SW-L-R)/22}" y="${T}" width="${(SW-L-R)/11}" height="${SH-T-B}" data-tip="KW ${d[0]}: ${fmt(d[1],1)} % krank"/>`; });
  c2 += '</svg>';
  const tt = AUSW.termintreue, cw=(SW-L-R)/tt.length, yt=val=>T+(1-val/100)*(SH-T-B);
  let c3 = `<svg viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="xMinYMid meet">`;
  [0,25,50,75,100].forEach(g=>c3+=`<line x1="${L}" x2="${SW-R}" y1="${yt(g)}" y2="${yt(g)}" stroke="#EEF0F2"/><text x="${L-8}" y="${yt(g)+4}" font-size="11" fill="#7A838B" text-anchor="end">${g} %</text>`);
  c3 += `<line x1="${L}" x2="${SW-R}" y1="${yt(90)}" y2="${yt(90)}" stroke="#1F2328" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${SW-R}" y="${yt(90)-6}" font-size="11" font-weight="700" fill="#1F2328" text-anchor="end">Ziel 90 %</text>`;
  tt.forEach(([m,a,b],i)=>{ const p=Math.round(a/b*100), x=L+i*cw+cw*.3, w=cw*.4;
    c3+=`<rect x="${x}" y="${yt(p)}" width="${w}" height="${yt(0)-yt(p)}" rx="4" fill="#00893D"/><text x="${x+w/2}" y="${yt(p)-8}" font-size="12.5" font-weight="700" fill="#1F2328" text-anchor="middle">${p} %</text>
      <text x="${x+w/2}" y="${SH-5}" font-size="12" font-weight="600" fill="#5F6870" text-anchor="middle">${m} · ${a}/${b}</text><rect class="hit" x="${L+i*cw}" y="${T}" width="${cw}" height="${SH-T-B}" data-tip="${m} 2026: ${a} von ${b} Projekten pünktlich ausgeliefert (${p} %)"/>`; });
  c3 += '</svg>';
  const c4 = hbars(AUSW.auslastung.map(([l,a,b])=>({l,v:a/b*100,txt:`${Math.round(a/b*100)} % · ${a}/${b} h`})), 120, [0,25,50,75,100], 100, '100 % = Plan', ' %', d=>`${d.l}: gebuchte / geplante Std. ${d.txt}`);
  const abs = {ab:0,dr:0,sc:0}; MITARBEITER.forEach(p=>{ if(!istAnw(p)) abs[p.s]++; });
  const nAbs = Object.values(abs).reduce((a,b)=>a+b,0);
  const ausl = AUSW.auslastung.reduce((s,x)=>s+x[1],0)/AUSW.auslastung.reduce((s,x)=>s+x[2],0)*100;
  const tA = AUSW.termintreue.reduce((s,x)=>[s[0]+x[1],s[1]+x[2]],[0,0]), tPct = Math.round(tA[0]/tA[1]*100);
  v.innerHTML = `
    <div class="ktiles">
      <div class="ktile"><div class="k">Krankheitsrate Bereich <span class="f">Ø 4 Wochen</span></div><div class="v">3,8 %<small>Vormonat 4,4 %</small></div><div class="s">Ziel ≤ 4 % · höchster Wert ZSA3 mit 7,9 %</div></div>
      <div class="ktile"><div class="k">Termintreue <span class="f">Jun–Nov 2026</span></div><div class="v">${tPct} %<small>${tA[0]} von ${tA[1]} pünktlich</small></div><div class="s">Ziel 90 % · gemessen am vereinbarten Liefertermin</div></div>
      <div class="ktile"><div class="k">Auslastung KW 47 <span class="f">gebuchte ÷ geplante Std.</span></div><div class="v">${fmt(ausl,0)} %<small>Bereich SMB</small></div><div class="s">Niedrigste: ZSA3 mit 74 % (1 krank, 1 Schulung)</div></div>
      <div class="ktile"><div class="k">Abwesenheiten heute</div><div class="v">${nAbs}<small>von ${MITARBEITER.length}</small></div>
        <div><div class="stackbar">${['ab','dr','sc'].filter(s=>abs[s]).map(s=>`<i class="${STATUS[s].c}" style="flex:${abs[s]}" data-tip="${STATUS[s].lang||STATUS[s].l}: ${abs[s]}"></i>`).join('')}</div>
        <div class="s" style="margin-top:4px">Krank/Urlaub ${abs.ab} · Dienstreise ${abs.dr} · Schulung ${abs.sc} · +${MITARBEITER.filter(p=>p.s==="ex").length} Ext. Service</div></div></div>
    </div>
    <div class="agrid">
      <div class="chart"><h4>Krankheitsrate je Team <span>Ø letzte 4 Wochen</span></h4><div class="cs">ZSA3 liegt deutlich über dem Bereichsziel von 4 %.</div>${c1}</div>
      <div class="chart"><h4>Krankheitsrate Verlauf <span>Bereich SMB · KW 36–47</span></h4><div class="cs">Herbstspitze in KW 41 mit 5,2 %, seitdem rückläufig.</div>${c2}</div>
      <div class="chart"><h4>Termintreue je Monat <span>pünktlich ausgelieferte Projekte</span></h4><div class="cs">Ziel 90 % in keinem Monat erreicht – Mittel ${tPct} %.</div>${c3}</div>
      <div class="chart"><h4>Auslastung je Team <span>KW 47 · gebuchte / geplante Stunden</span></h4><div class="cs">ZSA2, ZSA4 und ZSY/ZSC über 100 % (Mehrarbeit), ZSA3 deutlich darunter.</div>${c4}</div>
    </div>`;
}


/* =============================================================================
   Gesamt-Render & Ansichten
   ============================================================================= */
function renderAll(){
  renderPool(); renderMap(); renderProjects(); renderKPIs();
  if(S.pop) renderPop();
  if(!$('#bellMenu').hidden) renderBell();
  if(S.view==='forecast') renderForecast();
  if(S.view==='auswertung') renderAuswertung();
}
function setView(vw){
  if(vw==='massn'||vw==='stamm'){ toast(`„${vw==='massn'?'Maßnahmen':'Stammdaten'}“ ist im Prototyp noch nicht ausgestaltet`); return; }
  S.view = vw; closePop(); $('#snack').classList.add('hide');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.view===vw));
  $('#v-board').hidden = vw!=='board'; $('#v-forecast').hidden = vw!=='forecast'; $('#v-auswertung').hidden = vw!=='auswertung';
  if(vw==='forecast') renderForecast();
  if(vw==='auswertung') renderAuswertung();
}

/* =============================================================================
   Hallenplan: Rechteck aufziehen · verschieben · Größe ändern (Zeiger/Touch)
   ============================================================================= */
const map = $('#map');
let dr = null;
function toM(e){
  const r = map.getBoundingClientRect(), s = scale(), b = 4*s;
  return { x:(e.clientX-r.left-b)/(r.width-2*b)*HALLE.w, y:(e.clientY-r.top-b)/(r.height-2*b)*HALLE.h };
}
const snapM = v => Math.round(v);
function norm(a,b,f){
  const x0=Math.max(f.x,Math.min(a.x,b.x)), y0=Math.max(f.y,Math.min(a.y,b.y));
  const x1=Math.min(f.x+f.w,Math.max(a.x,b.x)), y1=Math.min(f.y+f.h,Math.max(a.y,b.y));
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
map.addEventListener('pointerdown', e=>{
  if(e.button>0 || e.target.closest('[data-pid]') || e.target.closest('.del')) return;
  const m = toM(e), pr = e.target.closest('.pr');
  if(pr){
    const nr = pr.dataset.nr;
    dr = {mode:e.target.closest('.rz')?'rz':'mv', nr, el:pr, m0:m, o:{...PLAN[nr]}, cand:{...PLAN[nr]}, moved:false, ok:true};
  } else {
    const fl = e.target.closest('.fl'); if(!fl) return;
    if(S.pop && S.pop.kind==='place') closePop();
    const f = FLAECHEN.find(x=>x.id===fl.dataset.fl);
    dr = {mode:'draw', f, a:{x:snapM(m.x),y:snapM(m.y)}, moved:false};
  }
  map.setPointerCapture(e.pointerId); e.preventDefault();
});
map.addEventListener('pointermove', e=>{
  if(!dr) return; const m = toM(e);
  if(dr.mode==='draw'){
    const r = norm(dr.a, {x:snapM(m.x),y:snapM(m.y)}, dr.f);
    if(r.w<1 && r.h<1) return;
    dr.moved = true; r.bad = r.w<6 || r.h<6 || !frei(r); S.ghost = r; dr.r = r; renderMap(); return;
  }
  const dx = snapM(m.x-dr.m0.x), dy = snapM(m.y-dr.m0.y), o = dr.o;
  if(dx||dy) dr.moved = true; if(!dr.moved) return;
  const c = dr.mode==='rz' ? {x:o.x,y:o.y,w:Math.max(6,o.w+dx),h:Math.max(6,o.h+dy)} : {x:o.x+dx,y:o.y+dy,w:o.w,h:o.h};
  dr.cand = c; dr.ok = !!flaecheVon(c) && frei(c, dr.nr);
  dr.el.setAttribute('style', box(c)); dr.el.classList.toggle('bad', !dr.ok);
  const dm = dr.el.querySelector('.dim-m'); if(dm) dm.textContent = `${c.w} × ${c.h} m`;
});
map.addEventListener('pointerup', e=>{
  if(!dr) return; const d = dr; dr = null; S.noClick = true; setTimeout(()=>S.noClick=false, 0);
  if(d.mode==='draw'){
    if(!d.moved || !d.r){ if(S.selRect||S.focus){ S.selRect=S.focus=null; renderAll(); } return; }
    if(d.r.bad){ S.ghost=null; renderMap(); toast(d.r.w<6||d.r.h<6 ? 'Rechteck zu klein – mindestens 6 × 6 m' : 'Fläche überschneidet ein anderes Projekt'); return; }
    renderMap();
    openPop('place', map.querySelector('.ghost').getBoundingClientRect());
    return;
  }
  if(!d.moved){
    if(S.sel){ zuteilen(S.sel, d.nr); return; }
    S.selRect = S.selRect===d.nr ? null : d.nr; S.focus = S.selRect; renderAll(); return;
  }
  if(d.ok){ snapshot(); PLAN[d.nr] = d.cand; S.selRect = d.nr; renderAll(); }
  else { renderMap(); toast('Nicht möglich – Projekt muss frei auf einer Montagefläche liegen'); }
});

/* =============================================================================
   Drag & Drop (Maus): Personenbilder und Projektkarten
   ============================================================================= */
let drag = null;   // {pid} oder {nr}
const stage = $('#stage');
stage.addEventListener('dragstart', e=>{
  const p = e.target.closest && e.target.closest('[data-pid]'), c = e.target.closest && e.target.closest('.pc2');
  if(p){ drag = {pid:p.dataset.pid}; p.classList.add('dragging'); }
  else if(c){ drag = {nr:c.dataset.nr}; c.classList.add('dragging'); }
  else return;
  closePop(); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','x');
});
const clearDrop = () => document.querySelectorAll('.drop-ok').forEach(x=>x.classList.remove('drop-ok'));
stage.addEventListener('dragend', ()=>{ drag=null; clearDrop(); document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); if(S.ghost&&!S.pop){S.ghost=null;renderMap();} });
function ziel(e){
  if(!drag) return null;
  if(drag.pid){
    const t = e.target.closest('.pr,.pc2,[data-drop]'); return t;
  }
  return e.target.closest('.fl,.pr');
}
stage.addEventListener('dragover', e=>{
  const t = ziel(e); clearDrop(); if(!t) return; e.preventDefault(); t.classList.add('drop-ok');
});
stage.addEventListener('drop', e=>{
  const t = ziel(e); if(!t) return; e.preventDefault(); const d = drag; drag = null; clearDrop();
  if(d.pid){
    const p = byId[d.pid];
    if(t.dataset.nr) return zuteilen(d.pid, t.dataset.nr);
    if(t.dataset.drop==='ab'){ if(istAnw(p)) openPop('person', t.getBoundingClientRect(), {pid:d.pid, pending:['ab','Krank']}); return; }
    if(t.dataset.drop==='svc'){ openPop('person', t.getBoundingClientRect(), {pid:d.pid, pending:['ex',null]}); return; }
    if(t.dataset.drop==='an'){ if(!istAnw(p)) loesen(d.pid); return; }
    if(t.dataset.drop==='ohne'){ if(!istAnw(p)||ZUTEILUNG[d.pid]) loesen(d.pid); return; }
    return;
  }
  // Projektkarte auf Fläche → Standardrechteck an der Abwurfstelle
  const pr = PR(d.nr), m = toM(e), f = FLAECHEN.find(x=>m.y>=x.y&&m.y<=x.y+x.h) || (m.y<25?FLAECHEN[0]:FLAECHEN[1]);
  const sz = PLAN[d.nr] ? {w:PLAN[d.nr].w,h:PLAN[d.nr].h} : {w:Math.max(8,Math.min(14,pr.soll*2+4)), h:8};
  const r = freiePos(f, sz.w, sz.h, m.x, m.y, d.nr);
  if(!r){ toast('Kein freier Platz in dieser Größe – Rechteck selbst aufziehen'); return; }
  platzieren(d.nr, r);
});

/* =============================================================================
   Klicks / Antippen
   ============================================================================= */
stage.addEventListener('click', e=>{
  const T = e.target;
  if(T.closest('#pop')){
    const P = S.pop, b = T.closest('button'); if(!P || !b) return;
    if(b.dataset.close!==undefined){ S.sel=null; closePop(); renderPool(); return; }
    if(b.dataset.place){ platzieren(b.dataset.place, S.ghost); return; }
    if(b.dataset.st){ const k=[b.dataset.st, b.dataset.g||null]; const p=byId[P.pid];
      const same = p.s===k[0] && (k[0]!=='ab'||p.grund===k[1]);
      P.pending = same ? null : k; P.target=null; P.bis='offen'; renderPop(); return; }
    if(b.dataset.target){ P.target=b.dataset.target; renderPop(); return; }
    if(b.dataset.bis){ P.bis=b.dataset.bis; renderPop(); return; }
    if(b.dataset.cancel!==undefined){ P.pending=null; renderPop(); return; }
    if(b.dataset.apply!==undefined){ setzeStatus(P.pid, P.pending[0], P.pending[1], {target:P.target,bis:P.bis}); return; }
    if(b.dataset.assign){ zuteilen(P.pid, b.dataset.assign); return; }
    if(b.dataset.unassign!==undefined){ loesen(P.pid); return; }
    if(b.dataset.mail!==undefined){ const p=byId[P.pid]; melde('mail',`Mail an ${p.n} versendet`,`Einsatzplan KW 47 · ${ZUTEILUNG[p.id]}`); renderKPIs(); toast(`✉ Einsatzplan KW 47 an ${p.n} gesendet`); return; }
    return;
  }
  if(T.closest('#bellMenu')){ if(T.closest('#allRead')){ MELDUNGEN.forEach(m=>m.neu=0); renderKPIs(); renderBell(); } return; }
  if(T.closest('#bell')){ const m=$('#bellMenu'); m.hidden=!m.hidden; if(!m.hidden){ closePop(); renderBell(); } return; }
  $('#bellMenu').hidden = true;
  if(T.closest('#modal') || T.closest('#snack')) return;
  const tab = T.closest('#tabs button'); if(tab){ setView(tab.dataset.view); return; }
  const kwb = T.closest('[data-kw]'); if(kwb){ S.kwOff = kwb.dataset.kw==='0' ? 0 : S.kwOff+Number(kwb.dataset.kw); setKW(); return; }
  const seg = T.closest('[data-seg] button'); if(seg){ seg.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===seg)); return; }
  const kpi = T.closest('.kpi'); if(kpi){ kpiClick(kpi.dataset.k); return; }
  if(T.closest('#newProj')){ openModal(); return; }
  if(T.closest('#clearPlan')){ if(!Object.keys(PLAN).length) return; snapshot(); PLAN={}; S.selRect=S.focus=null; snack('Montageflächen geleert – alle Projekte „nicht im Plan“', true); renderAll(); return; }
  if(S.view==='forecast'){ const r=T.closest('.fc-row.r'); if(r){ S.hl = S.hl===r.dataset.nr?null:r.dataset.nr; renderForecast(); } return; }
  if(S.view!=='board') return;
  const del = T.closest('[data-del]'); if(del){ ausPlan(del.dataset.del); return; }
  if(S.noClick) return;
  const person = T.closest('[data-pid]');
  if(!person && T.closest('#map .pr')) return;
  if(person){
    const pid = person.dataset.pid;
    if(S.sel===pid && S.pop){ S.sel=null; closePop(); renderPool(); return; }
    S.sel = pid; S.focus = null; S.selRect = null;
    const r = person.getBoundingClientRect(); renderPool(); renderMap(); renderProjects();
    openPop('person', r, {pid}); return;
  }
  const pcard = T.closest('.pc2');
  if(pcard){
    if(S.sel){ zuteilen(S.sel, pcard.dataset.nr); return; }
    S.focus = S.focus===pcard.dataset.nr ? null : pcard.dataset.nr; S.selRect = PLAN[S.focus] ? S.focus : null; renderAll(); return;
  }
  const area = T.closest('[data-drop="ab"]');
  if(area && S.sel && S.pop && S.pop.kind==='person' && istAnw(byId[S.sel])){ S.pop.pending=['ab','Krank']; renderPop(); return; }
  if(S.pop || S.sel || S.focus){ S.sel=null; S.focus=null; S.selRect=null; closePop(); renderAll(); }
});
stage.addEventListener('dblclick', e=>{ const c = e.target.closest('.pc2,.pr'); if(c){ S.hl=c.dataset.nr; setView('forecast'); } });
$('#undo').addEventListener('click', ()=>{ undo(); $('#snack').classList.add('hide'); });

function kpiClick(k){
  if(S.view!=='board') setView('board');
  const flash = el=>{ if(!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); };
  if(k==='an') flash($('.ptab'));
  if(k==='ohne') flash($('#ohne'));
  if(k==='under') document.querySelectorAll('.pr .cnt.under').forEach(c=>flash(c.closest('.pr')));
  if(k==='plan') document.querySelectorAll('.pc2 .tag.plan').forEach(t=>flash(t.closest('.pc2')));
  if(k==='rot'){ S.hl = (PROJEKTE.find(p=>forecast(p).amp.includes('r'))||{}).nr; setView('forecast'); }
  if(k==='mn') toast('3 Maßnahmen überfällig – Ansicht „Maßnahmen“ folgt');
}
function setKW(){
  const mo = new Date(2026,10,16+7*S.kwOff), so = new Date(mo); so.setDate(so.getDate()+6);
  $('#kwLabel').textContent = 'KW '+kw(mo); $('#kwRange').textContent = `${dstr(mo)}–${dstr(so)}${so.getFullYear()}`;
  if(S.kwOff) toast(`${S.kwOff>0?'Vorschau':'Rückblick'} KW ${kw(mo)} – im Prototyp werden die Daten von KW 47 gezeigt`);
}

/* ---------- Neues Projekt per Projektnummer ---------- */
function openModal(){
  const m = $('#modal'); m.hidden = false; closePop();
  m.innerHTML = `<div class="modal"><h3>Neues Projekt anlegen</h3><p>Projektnummer eingeben – Kunde, Termine, Soll-Besetzung und Plan-Stunden kommen aus den Stammdaten. Danach auf einer Montagefläche ein Rechteck aufziehen.</p>
    <div class="field"><input id="pnr" value="P-24141" spellcheck="false" autocomplete="off"><button class="btn" id="pSearch">Abrufen</button></div><div id="pRes"></div>
    <div class="pop-f"><button class="btn" id="pCancel">Abbrechen</button><button class="btn pri" id="pOk" disabled>Anlegen</button></div></div>`;
  const look = ()=>{
    const nr = $('#pnr').value.trim().toUpperCase(), d = ERP[nr], res = $('#pRes');
    if(!d){ res.innerHTML = `<div class="nf">Projektnummer „${nr}“ nicht gefunden.</div>`; $('#pOk').disabled=true; return; }
    if(PR(nr)){ res.innerHTML = `<div class="nf">${nr} ist bereits angelegt.</div>`; $('#pOk').disabled=true; return; }
    res.innerHTML = `<div class="preview"><div class="full"><span class="nm">${d.nm}</span><span style="display:flex;align-items:center;gap:6px">${mk(d.c,'mk" style="width:22px;height:22px')}<b style="font-size:12px;letter-spacing:.06em">${LOGO[d.c].n}</b></span></div>
      <div><div class="k">Projektart</div><div class="v">${d.kl==='extern'?'Extern':'Intern'}</div></div><div><div class="k">Zeitraum</div><div class="v">${d.from}–${d.to}</div></div>
      <div><div class="k">Soll-Besetzung</div><div class="v">${d.soll} Personen</div></div><div><div class="k">Plan-Stunden</div><div class="v">${fmt(d.plan)} h</div></div></div>`;
    $('#pOk').disabled=false; $('#pOk').dataset.nr=nr;
  };
  $('#pSearch').onclick = look; $('#pnr').onkeydown = e=>{ if(e.key==='Enter') look(); };
  $('#pCancel').onclick = ()=>{ m.hidden=true; };
  m.onclick = e=>{ if(e.target===m) m.hidden=true; };
  $('#pOk').onclick = ()=>{ const nr=$('#pOk').dataset.nr, d=ERP[nr]; m.hidden=true;
    PROJEKTE.push({nr, nm:d.nm, kl:d.kl, c:d.c, from:d.from, to:d.to, cur:'Vormontage', soll:d.soll, q:'g', plan:d.plan, ist:0, pct:0, pak:[0,20],
      ph:[['Vormontage',d.from,'18.12.'],['Montage','19.12.','29.01.'],['IBN','30.01.','05.02.']]});
    melde('mail','Projekt angelegt',`${nr} ${d.nm} · Start ${d.from} · noch nicht im Hallenplan`);
    renderAll(); toast(`${nr} ${d.nm} angelegt – jetzt Rechteck auf einer Montagefläche aufziehen`); };
  look(); setTimeout(()=>{ const i=$('#pnr'); if(i) i.select(); },50);
}

/* ---------- Skalierung, Uhr, Start ---------- */
function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
addEventListener('resize', ()=>{ fit(); if(S.pop) renderPop(); }); fit();
function tick(){ $('#clock').textContent = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick, 10000);
renderAll();
</script>
